<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hlasový Běžec - Závod s čísly</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .settings {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        select {
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #score { color: #2ecc71; }
        #lives { color: #e74c3c; }
        #number-display {
            font-size: 72px;
            font-weight: bold;
            color: #34495e;
            margin: 10px 0;
            background-color: #ecf0f1;
            border-radius: 10px;
            padding: 10px;
        }
        #game-canvas {
            width: 100%;
            height: 200px;
            background-color: #f1c40f;
            border: 4px solid #d35400;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }
        #status {
            font-style: italic;
            color: #7f8c8d;
            min-height: 40px;
            margin-top: 10px;
        }
        button#start-btn {
            padding: 15px 35px;
            font-size: 20px;
            background-color: #d35400;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        button#start-btn:hover { background-color: #a04000; }
    </style>
</head>
<body>

<div class="container">
    <div class="settings">
        <label for="lang-select"><strong>Jazyk tréninku: </strong></label>
        <select id="lang-select">
            <option value="cs-CZ">Čeština</option>
            <option value="en-US">English</option>
            <option value="de-DE">Deutsch</option>
            <option value="fr-FR">Français</option>
            <option value="fi-FI">Suomi</option>
        </select>
    </div>

    <div id="hud">
        <div id="score">Skóre: 0</div>
        <div id="lives">Životy: ❤️❤️❤️</div>
    </div>

    <div id="number-display">-</div>
    <canvas id="game-canvas" width="500" height="200"></canvas>
    <p id="status">Vyber jazyk a klikni na START!</p>
    <button id="start-btn">Start Závodu</button>
</div>

<script>
    const GAME_WIDTH = 500;
    const GAME_HEIGHT = 200;
    const GROUND_Y = 160;
    const RUNNER_X = 50;
    const JUMP_HEIGHT = 80;
    const OBSTACLE_SPEED = 1;

    const languageMaps1To10 = {
        'cs-CZ': { 1: ['1', 'jeden', 'jedna'], 2: ['2', 'dva'], 3: ['3', 'tři'], 4: ['4', 'čtyři'], 5: ['5', 'pět'], 6: ['6', 'šest'], 7: ['7', 'sedm'], 8: ['8', 'osm'], 9: ['9', 'devět'], 10: ['10', 'deset'] },
        'en-US': { 1: ['1', 'one'], 2: ['2', 'two'], 3: ['3', 'three'], 4: ['4', 'four'], 5: ['5', 'five'], 6: ['6', 'six'], 7: ['7', 'seven'], 8: ['8', 'eight'], 9: ['9', 'nine'], 10: ['10', 'ten'] },
        'de-DE': { 1: ['1', 'eins', 'eine'], 2: ['2', 'zwei'], 3: ['3', 'drei'], 4: ['4', 'vier'], 5: ['5', 'fünf'], 6: ['6', 'sechs'], 7: ['7', 'sieben'], 8: ['8', 'acht'], 9: ['9', 'neun'], 10: ['10', 'zehn'] },
        'fr-FR': { 1: ['1', 'un', 'une'], 2: ['2', 'deux'], 3: ['3', 'trois'], 4: ['4', 'quatre'], 5: ['5', 'cinq'], 6: ['6', 'six'], 7: ['7', 'sept'], 8: ['8', 'huit'], 9: ['9', 'neuf'], 10: ['10', 'dix'] },
        'fi-FI': { 1: ['1', 'yksi'], 2: ['2', 'kaksi'], 3: ['3', 'kolme'], 4: ['4', 'neljä'], 5: ['5', 'viisi'], 6: ['6', 'kuusi'], 7: ['7', 'seitsemän'], 8: ['8', 'kahdeksan'], 9: ['9', 'yhdeksän'], 10: ['10', 'kymmenen'] }
    };

    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const numberEl = document.getElementById('number-display');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const langSelect = document.getElementById('lang-select');
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let gameState = {
        score: 0,
        lives: 3,
        currentNumber: 0,
        active: false,
        runnerState: 'running', 
        runnerY: GROUND_Y,
        obstacleX: GAME_WIDTH,
    };

    let recognition = null;

    // Bezpečný pokus o inicializaci Speech API
    try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            
            recognition.onresult = (e) => handleVoiceInput(e.results[e.results.length-1][0].transcript);
            recognition.onend = () => { if (gameState.active && recognition) recognition.start(); };
            recognition.onerror = (e) => { console.error("Hlas chyba API:", e.error); };
        } else {
            statusEl.textContent = "Upozornění: Prohlížeč nepodporuje hlas. Hra pojede v demo režimu.";
        }
    } catch(err) {
        console.error("Nepodařilo se spustit SpeechRecognition:", err);
        statusEl.textContent = "Chyba mikrofonu. Hra pojede v demo režimu (automatický skok za 4s).";
    }

    function generateNewNumber() {
        gameState.currentNumber = Math.floor(Math.random() * 100) + 1;
        numberEl.textContent = gameState.currentNumber;
        gameState.obstacleX = GAME_WIDTH;
    }

    function updateHUD() {
        scoreEl.textContent = "Skóre: " + gameState.score;
        let hearts = "";
        for (let i = 0; i < gameState.lives; i++) hearts += "❤️";
        for (let i = gameState.lives; i < 3; i++) hearts += "🖤";
        livesEl.textContent = "Životy: " + hearts;
    }

    function triggerJump() {
        if (gameState.runnerState !== 'running') return;
        gameState.runnerState = 'jumping';
        let jumpHeight = 0;
        let direction = 1;
        const jumpInterval = setInterval(() => {
            jumpHeight += 5 * direction;
            gameState.runnerY = GROUND_Y - jumpHeight;
            if (jumpHeight >= JUMP_HEIGHT) direction = -1;
            if (jumpHeight <= 0 && direction === -1) {
                clearInterval(jumpInterval);
                gameState.runnerState = 'running';
                gameState.runnerY = GROUND_Y;
                gameState.score++;
                updateHUD();
                generateNewNumber();
            }
        }, 20);
    }

    function triggerTrip() {
        if (gameState.runnerState !== 'running') return;
        gameState.runnerState = 'tripping';
        gameState.lives--;
        updateHUD();
        
        setTimeout(() => {
            if (gameState.lives <= 0) {
                endGame();
            } else {
                gameState.runnerState = 'running';
                generateNewNumber();
            }
        }, 1000);
    }

    function handleVoiceInput(rawText) {
        if (!gameState.active || gameState.runnerState !== 'running') return;

        const cleanText = rawText.toLowerCase().replace(/[.,?!]/g, '').trim();
        statusEl.textContent = `Slyšel jsem: "${cleanText}"`;

        const currentLang = langSelect.value;
        let matched = false;

        if (gameState.currentNumber <= 10) {
            const validAnswers = languageMaps1To10[currentLang][gameState.currentNumber];
            if (validAnswers.includes(cleanText)) matched = true;
        } else {
            if (cleanText === gameState.currentNumber.toString()) matched = true;
        }

        if (matched) {
            triggerJump();
        } else {
            triggerTrip();
        }
    }

    function startGame() {
        gameState = { score: 0, lives: 3, currentNumber: 0, active: true, runnerState: 'running', runnerY: GROUND_Y, obstacleX: GAME_WIDTH };
        updateHUD();
        startBtn.style.display = 'none';
        generateNewNumber();
        
        if (recognition) {
            try {
                recognition.lang = langSelect.value;
                recognition.start();
                statusEl.textContent = "Závod začíná! Poslouchám...";
            } catch(e) {
                statusEl.textContent = "Mikrofon nešlo spustit. Hrajeme v demo režimu (stiskni MEZERNÍK pro skok).";
            }
        } else {
            statusEl.textContent = "Demo režim: Pro skok stiskni MEZERNÍK.";
        }
        
        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameState.active = false;
        if (recognition) { try { recognition.stop(); } catch(e){} }
        statusEl.textContent = `KONEC ZÁVODU! Dosáhl jsi skóre ${gameState.score}.`;
        startBtn.textContent = "Hrát znovu";
        startBtn.style.display = 'inline-block';
        numberEl.textContent = "KO";
        drawGame();
    }

    // Ovládání klávesnicí jako záloha (pro testování nebo demo)
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && gameState.active) {
            e.preventDefault();
            triggerJump();
        }
    });

    startBtn.addEventListener('click', startGame);

    // --- Vykreslování ---
    function drawGame() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Hlína
        ctx.fillStyle = "#8d6e63";
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
        
        // Trať
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(0, GROUND_Y - 5, GAME_WIDTH, 10);

        // Běžec (Panáček)
        ctx.fillStyle = (gameState.runnerState === 'tripping') ? "#c0392b" : "#3498db";
        ctx.fillRect(RUNNER_X, gameState.runnerY - 40, 30, 40); 

        // Překážka
        if (gameState.active && gameState.runnerState === 'running') {
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(gameState.obstacleX, GROUND_Y - 30, 20, 30);
        }
    }

    function gameLoop() {
        if (!gameState.active) return;

        if (gameState.runnerState === 'running') {
            gameState.obstacleX -= OBSTACLE_SPEED;
            if (gameState.obstacleX < RUNNER_X + 25 && gameState.obstacleX > RUNNER_X) {
                triggerTrip();
            }
        }
        
        drawGame();
        requestAnimationFrame(gameLoop);
    }

    // Vykreslit panáčka hned na začátku, aby plocha nebyla prázdná
    drawGame();
</script>

</body>
</html>
