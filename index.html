<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hlasový Přetahovaný Závod - Mega Multiplayer</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .screen { display: none; }
        .active { display: block; }

        .menu-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin: 15px 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .hud-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            background: #34495e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .hud-badge {
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
        }
        .hud-badge.mine {
            background: #2980b9;
            border: 1px solid #fff;
        }
        #number-display {
            font-size: 75px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
            background: #edf2f7;
            border-radius: 10px;
            padding: 3px;
        }
        canvas {
            width: 100%;
            height: auto;
            background-color: #27ae60;
            border: 4px solid #2c3e50;
            border-radius: 10px;
            display: block;
        }
        input, select, button {
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-large { font-size: 18px; padding: 15px 35px; }
        .btn-secondary { background-color: #7f8c8d; }
        .btn-secondary:hover { background-color: #95a5a6; }
        
        #status { font-style: italic; color: #7f8c8d; min-height: 35px; margin: 10px 0; }
        .room-info { font-weight: bold; color: #e67e22; font-size: 20px; margin-bottom: 5px; }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .stats-table th, .stats-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .stats-table th { background-color: #34495e; color: white; }
        .winner-announcement { font-size: 28px; color: #2ecc71; font-weight: bold; margin: 15px; }
    </style>
</head>
<body>

<div class="container">

    <div id="global-profile-box" class="menu-card" style="background-color: #fff3e0; border: 2px solid #ffb74d; margin-bottom: 20px;">
        <label style="font-weight: bold; color: #e67e22;">Tvoje závodní jméno: </label>
        <input type="text" id="player-name-input" value="Běžec" maxlength="12" style="font-weight: bold; text-align: center; width: 180px;">
    </div>

    <div id="screen-main" class="screen active">
        <h2>Hlasový Závod: Velká Přetahovaná</h2>
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
            <button id="main-choose-solo" class="btn-large" style="width: 240px;">🏃 Hrát sám (Proti PC)</button>
            <button id="main-choose-online" class="btn-large" style="background-color: #9b59b6; width: 240px;">🌐 Online Multiplayer</button>
        </div>
    </div>

    <div id="screen-solo-setup" class="screen">
        <h2>Nastavení Solo hry</h2>
        <div class="menu-card">
            <p><label>Obtížnost AI bota: </label>
            <select id="difficulty-select">
                <option value="easy">Lehká (Pomalé AI)</option>
                <option value="medium" selected>Střední (Vyvážená)</option>
                <option value="hard">Těžká (Férová výzva)</option>
            </select></p>
            
            <p><label>Jazyk tréninku: </label>
            <select id="lang-select-solo">
                <option value="cs-CZ">Čeština</option>
                <option value="en-US">English</option>
                <option value="de-DE">Deutsch</option>
                <option value="fr-FR">Français</option>
                <option value="fi-FI">Suomi</option>
            </select></p>
            <br>
            <button id="solo-start-game-btn" class="btn-success btn-large">Vstoupit na trať</button>
        </div>
        <button class="btn-secondary" onclick="changeScreen('screen-main')">← Zpět</button>
    </div>

    <div id="screen-online-branch" class="screen">
        <h2>Online Lobby</h2>
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
            <button id="online-go-create" class="btn-success" style="padding: 15px 25px;">➕ Založit novou hru</button>
            <button id="online-go-join" style="background-color: #e67e22; padding: 15px 25px;">🔑 Připojit se ke hře</button>
        </div>
        <br><br>
        <button class="btn-secondary" onclick="changeScreen('screen-main')">← Zpět do hlavního menu</button>
    </div>

    <div id="screen-online-create" class="screen">
        <h2>Založit novou místnost</h2>
        <div class="menu-card">
            <p><label>Maximální počet hráčů: </label>
            <select id="player-count-select">
                <option value="2">2 Hráči (Duel)</option>
                <option value="3">3 Hráči</option>
                <option value="4">4 Hráči</option>
                <option value="5">5 Hráčů</option>
                <option value="6">6 Hráčů</option>
                <option value="7">7 Hráčů</option>
                <option value="8">8 Hráčů</option>
            </select></p>

            <p><label>Jazyk pro celou místnost: </label>
            <select id="lang-select-online">
                <option value="cs-CZ">Čeština</option>
                <option value="en-US">English</option>
                <option value="de-DE">Deutsch</option>
                <option value="fr-FR">Français</option>
                <option value="fi-FI">Suomi</option>
            </select></p>
            <br>
            <button id="create-room-execute-btn" class="btn-success btn-large">Vytvořit a čekat na lidi</button>
        </div>
        <button class="btn-secondary" onclick="changeScreen('screen-online-branch')">← Zpět</button>
    </div>

    <div id="screen-online-join" class="screen">
        <h2>Zadej kód hry</h2>
        <div class="menu-card">
            <input type="text" id="room-code-input" placeholder="Např. 4821" style="font-size: 20px; text-align: center; width: 180px;">
            <br><br>
            <button id="join-room-execute-btn" class="btn-large" style="background-color: #e67e22;">Vstoupit do místnosti</button>
        </div>
        <button class="btn-secondary" onclick="changeScreen('screen-online-branch')">← Zpět</button>
    </div>

    <div id="screen-game" class="screen">
        <div id="room-id-display" class="room-info"></div>
        <div id="hud-players-container" class="hud-container"></div>

        <div id="number-display">-</div>
        <canvas id="game-canvas" width="600" height="520"></canvas>
        <p id="status">Připrav se...</p>
        <button id="start-match-btn" class="btn-success btn-large" style="display:none;">START ZÁVODU</button>
    </div>

    <div id="screen-victory" class="screen">
        <div id="victory-title" class="winner-announcement">Vítěz!</div>
        <h3>Výsledková tabule zápasu</h3>
        <table class="stats-table">
            <thead>
                <tr>
                    <th>Hráč</th>
                    <th>Skóre (Body)</th>
                    <th>Zbývající životy</th>
                    <th>Výsledek</th>
                </tr>
            </thead>
            <tbody id="stats-tbody"></tbody>
        </table>
        
        <div id="replay-section" style="margin-top: 25px; display: none;">
            <p>Chceš hrát znovu?</p>
            <button id="rematch-btn" class="btn-success btn-large">Ano, nová hra</button>
            <button onclick="changeScreen('screen-main')" class="btn-secondary">Ne, do hlavního menu</button>
        </div>
    </div>

</div>

<script>
    // --- INTEGRACE FIREBASE PROJEKTU ---
    const firebaseConfig = {
        apiKey: "AIzaSyADCqnyF13k2oHefln1rNBqvZm5_BnroPo",
        authDomain: "hlasovahra.firebaseapp.com",
        databaseURL: "https://hlasovahra-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hlasovahra",
        storageBucket: "hlasovahra.firebasestorage.app",
        messagingSenderId: "7010973655",
        appId: "1:7010973655:web:a9134f8f83d4b1e104bd92",
        measurementId: "G-L3SHDVNWWW"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- RENDER CONFIGURATION ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    const BASE_X = 220; 
    const STEP_X = 85;  
    
    // Fixní pozice překážek na trati, aby lícovaly s krokem běžců
    const staticHurdlePositions = [92, 177, 262, 347, 432, 517];

    const playerColors = [
        "#3498db", "#e74c3c", "#9b59b6", "#e67e22", 
        "#1abc9c", "#f1c40f", "#34495e", "#7f8c8d"
    ];

    const languageMaps1To10 = {
        'cs-CZ': { 1: ['1', 'jeden', 'jedna'], 2: ['2', 'dva'], 3: ['3', 'tři'], 4: ['4', 'čtyři'], 5: ['5', 'pět'], 6: ['6', 'šest'], 7: ['7', 'sedm'], 8: ['8', 'osm'], 9: ['9', 'devět'], 10: ['10', 'deset'] },
        'en-US': { 1: ['1', 'one'], 2: ['2', 'two'], 3: ['3', 'three'], 4: ['4', 'four'], 5: ['5', 'five'], 6: ['6', 'six'], 7: ['7', 'seven'], 8: ['8', 'eight'], 9: ['9', 'nine'], 10: ['10', 'ten'] },
        'de-DE': { 1: ['1', 'eins', 'eine'], 2: ['2', 'zwei'], 3: ['3', 'drei'], 4: ['4', 'vier'], 5: ['5', 'fünf'], 6: ['6', 'sechs'], 7: ['7', 'sieben'], 8: ['8', 'acht'], 9: ['9', 'neun'], 10: ['10', 'zehn'] },
        'fr-FR': { 1: ['1', 'un', 'une'], 2: ['2', 'deux'], 3: ['3', 'trois'], 4: ['4', 'quatre'], 5: ['5', 'cinq'], 6: ['6', 'six'], 7: ['7', 'sept'], 8: ['8', 'huit'], 9: ['9', 'neuf'], 10: ['10', 'dix'] },
        'fi-FI': { 1: ['1', 'yksi'], 2: ['2', 'kaksi'], 3: ['3', 'kolme'], 4: ['4', 'neljä'], 5: ['5', 'viisi'], 6: ['6', 'kuusi'], 7: ['7', 'seitsemän'], 8: ['8', 'kahdeksan'], 9: ['9', 'yhdeksän'], 10: ['10', 'kymmenen'] }
    };

    // --- GLOBÁLNÍ STAV ---
    let gameMode = 'solo'; 
    let roomRef = null;
    let myRole = 'p1'; 
    let maxPlayersInRoom = 2;
    let botInterval = null;
    let activeLanguage = 'cs-CZ';

    let myState = { score: 0, lives: 3, currentNumber: 0, state: 'running', y: 0, jumpProgress: 0, name: "Běžec" };
    let remotePlayers = {}; 
    let gameStarted = false;

    const statusEl = document.getElementById('status');
    const numberEl = document.getElementById('number-display');
    const startMatchBtn = document.getElementById('start-match-btn');
    const hudContainer = document.getElementById('hud-players-container');

    // --- HLASOVÁ REKOGNICE (ZRYCHLENÁ POMOCÍ INTERIM RESULTS) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true; // Zpracování v reálném čase během mluvení!
        
        recognition.onresult = (e) => {
            if (!gameStarted || myState.state !== 'running' || myState.lives <= 0) return;
            
            // Prohledáme aktuální dávku průběžného textu ze vstupu
            let fullTranscript = '';
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                fullTranscript += e.results[i][0].transcript;
            }
            
            handleLiveVoice(fullTranscript);
        };
        
        recognition.onend = () => { 
            if (gameStarted && myState.lives > 0 && myState.state !== 'won') recognition.start(); 
        };
    }

    function changeScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        
        // Zobrazovat box pro jméno pouze v menu strukturách
        if(screenId === 'screen-game' || screenId === 'screen-victory') {
            document.getElementById('global-profile-box').style.display = 'none';
        } else {
            document.getElementById('global-profile-box').style.display = 'block';
        }
        
        if(screenId !== 'screen-game') resetGameEngine();
    }

    function resetGameEngine() {
        gameStarted = false;
        if(recognition) try { recognition.stop(); } catch(e){}
        if(botInterval) clearInterval(botInterval);
        if(roomRef) roomRef.off();
        
        let chosenName = document.getElementById('player-name-input').value.trim() || "Běžec";
        myState = { score: 0, lives: 3, currentNumber: 0, state: 'running', y: 0, jumpProgress: 0, name: chosenName };
        remotePlayers = {};
        document.getElementById('replay-section').style.display = 'none';
    }

    // --- LOGIKA PRŮCHODU MENU ---
    document.getElementById('main-choose-solo').addEventListener('click', () => changeScreen('screen-solo-setup'));
    document.getElementById('main-choose-online').addEventListener('click', () => changeScreen('screen-online-branch'));
    document.getElementById('online-go-create').addEventListener('click', () => changeScreen('screen-online-create'));
    document.getElementById('online-go-join').addEventListener('click', () => changeScreen('screen-online-join'));

    // SPÁLENÍ SÓLO HRY
    document.getElementById('solo-start-game-btn').addEventListener('click', () => {
        gameMode = 'solo';
        myRole = 'p1';
        activeLanguage = document.getElementById('lang-select-solo').value;
        myState.name = document.getElementById('player-name-input').value.trim() || "Ty";

        remotePlayers['bot'] = { score: 0, lives: 3, state: 'running', y: 0, jumpProgress: 0, name: "Počítač (AI)" };
        
        changeScreen('screen-game');
        document.getElementById('room-id-display').textContent = `Solo Trénink [Obtížnost: ${document.getElementById('difficulty-select').value.toUpperCase()}]`;
        startMatchBtn.style.display = 'inline-block';
        statusEl.textContent = "Připraven ke startu.";
        renderHUD();
    });

    // MULTIPLAYER ZALOŽENÍ
    document.getElementById('create-room-execute-btn').addEventListener('click', () => {
        gameMode = 'online';
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        maxPlayersInRoom = parseInt(document.getElementById('player-count-select').value);
        activeLanguage = document.getElementById('lang-select-online').value;
        myRole = 'p1';
        myState.name = document.getElementById('player-name-input').value.trim() || "Hostitel";
        
        roomRef = db.ref('rooms/' + code);
        let initialRoomData = {
            status: 'waiting',
            maxPlayers: maxPlayersInRoom,
            language: activeLanguage,
            p1: { score: 0, lives: 3, state: 'running', currentNumber: 0, jumpProgress: 0, name: myState.name }
        };
        
        roomRef.set(initialRoomData);
        changeScreen('screen-game');
        document.getElementById('room-id-display').textContent = `Kód místnosti: ${code}`;
        statusEl.textContent = `Místnost vytvořena. Čeká se na naplnění kapacity (${maxPlayersInRoom} hráčů)...`;
        listenToRoom();
    });

    // MULTIPLAYER PŘIPOJENÍ
    document.getElementById('join-room-execute-btn').addEventListener('click', () => {
        gameMode = 'online';
        const code = document.getElementById('room-code-input').value.trim();
        if(!code) return;

        let chosenName = document.getElementById('player-name-input').value.trim() || "Host";

        roomRef = db.ref('rooms/' + code);
        roomRef.once('value', (snap) => {
            const data = snap.val();
            if(!data) { alert("Místnost neexistuje!"); return; }
            if(data.status === 'playing' || data.status === 'finished') { alert("Závod již běží!"); return; }
            
            let activeKeys = Object.keys(data).filter(k => k.startsWith('p'));
            if(activeKeys.length >= data.maxPlayers) { alert("Místnost je plná!"); return; }

            let nextIndex = activeKeys.length + 1;
            myRole = 'p' + nextIndex;
            myState.name = chosenName;
            activeLanguage = data.language; // Automatické převzetí nastaveného jazyka místnosti

            let updates = {};
            updates[myRole] = { score: 0, lives: 3, state: 'running', currentNumber: 0, jumpProgress: 0, name: myState.name };
            
            if(activeKeys.length + 1 === data.maxPlayers) {
                updates['status'] = 'ready';
            }

            roomRef.update(updates);
            changeScreen('screen-game');
            document.getElementById('room-id-display').textContent = `Kód místnosti: ${code}`;
            listenToRoom();
        });
    });

    function listenToRoom() {
        roomRef.on('value', (snap) => {
            const data = snap.val();
            if(!data) return;

            maxPlayersInRoom = data.maxPlayers;
            activeLanguage = data.language || 'cs-CZ';
            
            let keys = Object.keys(data).filter(k => k.startsWith('p'));
            remotePlayers = {};
            keys.forEach(k => {
                if(k !== myRole) remotePlayers[k] = data[k];
                else if(gameStarted) myState.currentNumber = data[myRole].currentNumber;
            });

            renderHUD();
            checkWinConditions();

            if (data.status === 'ready' && !gameStarted) {
                if (myRole === 'p1') {
                    startMatchBtn.style.display = 'inline-block';
                    statusEl.textContent = "Všichni jsou připojeni! Můžeš odstartovat zápas.";
                } else {
                    statusEl.textContent = "Místnost je plná. Čekej na start od zakladatele...";
                }
            }
            if (data.status === 'playing' && !gameStarted) {
                executeStart();
            }
        });
    }

    function renderHUD() {
        hudContainer.innerHTML = "";
        let myHearts = "❤️".repeat(Math.max(0, myState.lives)) + "🖤".repeat(3 - Math.max(0, myState.lives));
        let myBadge = document.createElement('div');
        myBadge.className = "hud-badge mine";
        myBadge.textContent = `${myState.name} (Ty): ${myState.score} b. | ${myHearts}`;
        hudContainer.appendChild(myBadge);

        Object.keys(remotePlayers).forEach(k => {
            let p = remotePlayers[k];
            let hearts = "❤️".repeat(Math.max(0, p.lives)) + "🖤".repeat(3 - Math.max(0, p.lives));
            let badge = document.createElement('div');
            badge.className = "hud-badge";
            badge.textContent = `${p.name}: ${p.score} b. | ${hearts}`;
            hudContainer.appendChild(badge);
        });
    }

    startMatchBtn.addEventListener('click', () => {
        if (gameMode === 'solo') {
            executeStart();
        } else if (myRole === 'p1' && roomRef) {
            let keys = [myRole, ...Object.keys(remotePlayers)];
            let updates = { status: 'playing' };
            keys.forEach(k => {
                updates[k + '/currentNumber'] = Math.floor(Math.random() * 50) + 1;
            });
            roomRef.update(updates);
        }
    });

    function executeStart() {
        gameStarted = true;
        startMatchBtn.style.display = 'none';
        statusEl.textContent = "Běž! Odpověz co nejrychleji.";
        
        if (gameMode === 'solo') {
            myState.currentNumber = Math.floor(Math.random() * 10) + 1;
            startSoloBotAI();
        }

        if (recognition) {
            recognition.lang = activeLanguage;
            recognition.start();
        }
        requestAnimationFrame(gameLoop);
    }

    // --- VYVÁŽENÉ A HRATELNÉ HRANICE TĚŽKÉHO AI BOTU ---
    function startSoloBotAI() {
        const diff = document.getElementById('difficulty-select').value;
        let tickTime = 4200;
        let jumpChance = 0.55;
        let tripChance = 0.15;

        if (diff === 'easy') {
            tickTime = 5200; jumpChance = 0.35; tripChance = 0.35;
        } else if (diff === 'hard') {
            tickTime = 3000;    // Zpomaleno z 2.2s (Bota lze nyní čistým během porazit!)
            jumpChance = 0.75;  // Úspěšnost snížena z 85% na 75%
            tripChance = 0.08;  // Zvýšena šance na drobnou lidskou chybu bota
        }

        botInterval = setInterval(() => {
            if (!gameStarted || remotePlayers['bot'].lives <= 0 || myState.state === 'won') return;
            
            let roll = Math.random();
            if (roll < jumpChance) {
                remotePlayers['bot'].state = 'jumping';
                let bFrame = 0;
                const bTotalFrames = 30;

                let bJmp = setInterval(() => {
                    bFrame++;
                    let progress = bFrame / bTotalFrames;
                    remotePlayers['bot'].jumpProgress = progress;
                    remotePlayers['bot'].y = -(4 * 65 * progress * (1 - progress));
                    
                    if(bFrame >= bTotalFrames) {
                        clearInterval(bJmp);
                        remotePlayers['bot'].state = 'running';
                        remotePlayers['bot'].y = 0;
                        remotePlayers['bot'].jumpProgress = 0;
                        remotePlayers['bot'].score++;
                        renderHUD();
                        checkWinConditions();
                    }
                }, 20);
            } else if (roll > (1 - tripChance)) {
                remotePlayers['bot'].state = 'tripping';
                remotePlayers['bot'].lives--;
                renderHUD();
                checkWinConditions();
                setTimeout(() => { 
                    if(remotePlayers['bot'] && remotePlayers['bot'].lives > 0) remotePlayers['bot'].state = 'running'; 
                }, 1200);
            }
        }, tickTime);
    }

    function checkWinConditions() {
        if (!gameStarted) return;

        let all = [{ id: myRole, ...myState }];
        Object.keys(remotePlayers).forEach(k => all.push({ id: k, ...remotePlayers[k] }));

        let alivePlayers = all.filter(p => p.lives > 0);
        let winnerId = null;

        if (alivePlayers.length === 1) {
            winnerId = alivePlayers[0].id;
        } else if (alivePlayers.length > 1) {
            all.forEach(p => {
                let opponents = all.filter(o => o.id !== p.id);
                let maxOpponentScore = Math.max(...opponents.map(o => o.score));
                if (p.score - maxOpponentScore >= 4) {
                    winnerId = p.id;
                }
            });
        }

        if (winnerId) {
            gameStarted = false;
            if(gameMode === 'online' && roomRef) roomRef.child('status').set('finished');
            showVictoryScreen(winnerId, all);
        }
    }

    function showVictoryScreen(winnerId, allPlayersList) {
        if(botInterval) clearInterval(botInterval);
        if(recognition) try { recognition.stop(); } catch(e){}

        const titleEl = document.getElementById('victory-title');
        const tbody = document.getElementById('stats-tbody');
        tbody.innerHTML = "";

        if (winnerId === myRole) {
            titleEl.textContent = "🎉 Vítězství! Skvělý závod! 🎉";
            titleEl.style.color = "#2ecc71";
        } else {
            let winnerName = remotePlayers[winnerId] ? remotePlayers[winnerId].name : "Soupeř";
            titleEl.textContent = `💀 Konec! Vyhrál ${winnerName}! 💀`;
            titleEl.style.color = "#e74c3c";
        }

        allPlayersList.sort((a,b) => b.score - a.score).forEach(p => {
            let tr = document.createElement('tr');
            let displayName = p.id === myRole ? `<b>${p.name} (Ty)</b>` : p.name;
            let statusText = p.id === winnerId ? "🥇 VÍTĚZ" : (p.lives <= 0 ? "❌ KO" : "🥈 Poražen");
            tr.innerHTML = `<td>${displayName}</td><td>${p.score}</td><td>${p.lives}/3</td><td>${statusText}</td>`;
            tbody.appendChild(tr);
        });

        changeScreen('screen-victory');
        setTimeout(() => { document.getElementById('replay-section').style.display = 'block'; }, 1500);
    }

    document.getElementById('rematch-btn').addEventListener('click', () => {
        let currentModeSaved = gameMode;
        resetGameEngine();
        if (currentModeSaved === 'solo') {
            gameMode = 'solo';
            myRole = 'p1';
            myState.name = document.getElementById('player-name-input').value.trim() || "Ty";
            remotePlayers['bot'] = { score: 0, lives: 3, state: 'running', y: 0, jumpProgress: 0, name: "Počítač (AI)" };
            changeScreen('screen-game');
            startMatchBtn.style.display = 'inline-block';
            statusEl.textContent = "Nový zápas připraven.";
            renderHUD();
        } else if (roomRef) {
            gameMode = 'online';
            if (myRole === 'p1') {
                let resetData = { status: 'ready', maxPlayers: maxPlayersInRoom, language: activeLanguage };
                resetData[myRole] = { score: 0, lives: 3, state: 'running', currentNumber: 0, jumpProgress: 0, name: myState.name };
                roomRef.set(resetData);
            }
            changeScreen('screen-game');
            listenToRoom();
        }
    });

    // --- REÁLNÝ ČAS ANALÝZY HLASU (DOPŘEDNÉ VYHODNOCENÍ) ---
    function handleLiveVoice(rawText) {
        const cleanText = rawText.toLowerCase().replace(/[.,?!]/g, '').trim();
        statusEl.textContent = `Slyším průběžně: "${cleanText}"`;

        let matched = false;
        if (myState.currentNumber <= 10) {
            const validAnswers = languageMaps1To10[activeLanguage][myState.currentNumber];
            // Ověříme, zda se v řečeném řetězci nachází jedno z validních slov
            if (validAnswers && validAnswers.some(ans => cleanText.includes(ans))) {
                matched = true;
            }
        } else {
            if (cleanText.includes(myState.currentNumber.toString())) {
                matched = true;
            }
        }

        if (matched) {
            triggerJump();
        }
    }

    // ZÁLOŽNÍ CHYBOVÝ FINIŠER (Když se uživatel odmlčí a nic netrefil)
    if (SpeechRecognition) {
        recognition.onspeechend = () => {
            setTimeout(() => {
                // Pokud uživatel domluvil a kód stále visí v běžném běhu, bereme to jako nesprávný pokus (zakopnutí)
                if (gameStarted && myState.state === 'running' && myState.lives > 0) {
                    triggerTrip();
                }
            }, 600);
        };
    }

    function triggerJump() {
        myState.state = 'jumping';
        myState.jumpProgress = 0;
        sendStateToFirebase();

        let frame = 0;
        const totalFrames = 30; // 600 milisekund trvání letu nad překážkou

        const jumpInterval = setInterval(() => {
            frame++;
            let progress = frame / totalFrames;
            myState.jumpProgress = progress;
            
            // Křivka paraboly
            myState.y = -(4 * 65 * progress * (1 - progress));
            sendStateToFirebase();

            if (frame >= totalFrames) {
                clearInterval(jumpInterval);
                myState.state = 'running';
                myState.y = 0;
                myState.jumpProgress = 0;
                
                myState.score++;
                myState.currentNumber = Math.floor(Math.random() * 50) + 1;
                
                sendStateToFirebase();
                renderHUD();
                checkWinConditions();
            }
        }, 20);
    }

    function triggerTrip() {
        myState.state = 'tripping';
        myState.lives--;
        sendStateToFirebase();
        renderHUD();
        checkWinConditions();

        setTimeout(() => {
            if (myState.lives > 0 && gameStarted) {
                myState.state = 'running';
                myState.currentNumber = Math.floor(Math.random() * 50) + 1;
                sendStateToFirebase();
            }
        }, 1200);
    }

    function sendStateToFirebase() {
        if (gameMode === 'online' && roomRef) {
            roomRef.child(myRole).update({
                score: myState.score,
                lives: myState.lives,
                state: myState.state,
                y: myState.y,
                jumpProgress: myState.jumpProgress,
                currentNumber: myState.currentNumber
            });
        }
    }

    // --- GRAPHICS ENGINE S SÍTÍ PŘEKÁŽEK ---
    function drawRunner(x, y, color, name, isTripping, isJumping) {
        ctx.save();
        if (isTripping) {
            ctx.translate(x + 12, y - 10);
            ctx.rotate(Math.PI / 2);
            ctx.translate(-(x + 12), -(y - 10));
        }

        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.beginPath();
        ctx.ellipse(x + 12, y, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(name, x + 12, y - 48);

        ctx.fillStyle = "#ffcc99";
        ctx.beginPath();
        ctx.arc(x + 12, y - 36, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x + 3, y - 30, 18, 18, 4) : ctx.fillRect(x + 3, y - 30, 18, 18);
        ctx.fill();

        ctx.strokeStyle = "#1a1a1a";
        ctx.lineWidth = 3.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        
        if (isJumping) {
            ctx.moveTo(x + 6, y - 12); ctx.lineTo(x + 1, y - 5);
            ctx.moveTo(x + 18, y - 12); ctx.lineTo(x + 23, y - 5);
        } else if (isTripping) {
            ctx.moveTo(x + 7, y - 12); ctx.lineTo(x + 5, y - 2);
            ctx.moveTo(x + 17, y - 12); ctx.lineTo(x + 15, y - 2);
        } else {
            let dynamicLegSwing = Math.sin(Date.now() * 0.015) * 6;
            ctx.moveTo(x + 7, y - 12); ctx.lineTo(x + 7 + dynamicLegSwing, y);
            ctx.moveTo(x + 17, y - 12); ctx.lineTo(x + 17 - dynamicLegSwing, y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawHurdle(x, y) {
        ctx.save();
        ctx.strokeStyle = "#444";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x - 6, y); ctx.lineTo(x + 16, y);
        ctx.moveTo(x, y); ctx.lineTo(x, y - 24);
        ctx.moveTo(x + 10, y); ctx.lineTo(x + 10, y - 24);
        ctx.stroke();

        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(x - 6, y - 24, 22, 6);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x - 1, y - 24, 4, 6);
        ctx.fillRect(x + 7, y - 24, 4, 6);
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let list = [{ role: myRole, ...myState }];
        Object.keys(remotePlayers).forEach(k => list.push({ role: k, ...remotePlayers[k] }));

        let activeTracksCount = Math.max(2, list.length);
        let laneHeight = Math.floor(canvas.height / activeTracksCount);

        list.sort((a,b) => a.role.localeCompare(b.role));

        // RENDER TRATÍ A FIXNÍCH PŘEKÁŽEK
        for (let i = 0; i < activeTracksCount; i++) {
            let laneY = (i * laneHeight) + (laneHeight - 10);
            
            ctx.fillStyle = i % 2 === 0 ? "#b35942" : "#9e4e39";
            ctx.fillRect(0, laneY - 35, canvas.width, 40);

            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(0, laneY - 38, canvas.width, 3);

            // CÍLOVÁ ČÁRA NA KONCI OBRAZOVKY
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(550, laneY - 35, 10, 40);
            ctx.fillStyle = "#000000";
            ctx.fillRect(555, laneY - 35, 5, 20);
            ctx.fillRect(550, laneY - 15, 5, 20);

            // Vykreslení celé řady překážek na této dráze
            staticHurdlePositions.forEach(hx => {
                drawHurdle(hx, laneY);
            });
        }

        // RENDER BĚŽCŮ
        list.forEach((player, index) => {
            let laneY = (index * laneHeight) + (laneHeight - 10);
            
            let opponents = list.filter(o => o.role !== player.role);
            let maxOppScore = opponents.length > 0 ? Math.max(...opponents.map(o => o.score)) : 0;
            
            let scoreDelta = player.score - maxOppScore;
            let baseX = BASE_X + (scoreDelta * STEP_X);
            
            // Plynulý dopředný pohyb během letu paraboly
            let visualXOffset = 0;
            if (player.state === 'jumping' && player.jumpProgress) {
                visualXOffset = player.jumpProgress * STEP_X;
            }
            
            let currentX = baseX + visualXOffset;
            currentX = Math.max(25, Math.min(555, currentX));

            let color = playerColors[index % playerColors.length];
            let nameTag = player.name;
            
            if(player.lives <= 0) {
                drawRunner(currentX, laneY, color, `${nameTag} [KO]`, true, false);
            } else {
                let currentY = laneY + (player.y || 0);
                drawRunner(currentX, currentY, color, nameTag, player.state === 'tripping', player.state === 'jumping');
            }
        });
    }

    function gameLoop() {
        draw();
        if (gameStarted) {
            if (myState.lives > 0 && myState.state === 'running') {
                numberEl.textContent = myState.currentNumber;
            } else if (myState.state === 'tripping') {
                numberEl.textContent = "💥";
            } else if (myState.lives <= 0) {
                numberEl.textContent = "KO";
            }
            requestAnimationFrame(gameLoop);
        }
    }

    draw();
</script>
