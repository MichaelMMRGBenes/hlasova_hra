<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hlasový Závod - Multiplayer</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .menu-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }
        .hud-container {
            display: flex;
            justify-content: space-between;
            background: #34495e;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        #number-display {
            font-size: 80px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
            background: #edf2f7;
            border-radius: 10px;
            padding: 5px;
        }
        canvas {
            width: 100%;
            height: 300px;
            background-color: #f1c40f;
            border: 4px solid #d35400;
            border-radius: 10px;
            display: block;
        }
        input, select, button {
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        #start-btn { background-color: #2ecc71; font-size: 18px; padding: 12px 30px; }
        #start-btn:hover { background-color: #27ae60; }
        #status { font-style: italic; color: #7f8c8d; min-height: 35px; margin: 10px 0; }
        .room-info { font-weight: bold; color: #e67e22; font-size: 18px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-section">
        <div>
            <label>Jazyk: </label>
            <select id="lang-select">
                <option value="cs-CZ">Čeština</option>
                <option value="en-US">English</option>
                <option value="de-DE">Deutsch</option>
                <option value="fr-FR">Français</option>
                <option value="fi-FI">Suomi</option>
            </select>
        </div>
        <button id="create-btn">Vytvořit hru</button>
        <div>
            <input type="text" id="room-input" placeholder="Kód hry (např. 1234)">
            <button id="join-btn">Připojit se</button>
        </div>
    </div>

    <div id="room-display" class="room-info"></div>

    <div class="hud-container">
        <div id="my-hud">Ty: 0 m (❤️❤️ Bakalář)</div>
        <div id="opp-hud">Soupeř: Čeká se...</div>
    </div>

    <div id="number-display">-</div>
    
    <canvas id="game-canvas" width="600" height="300"></canvas>

    <p id="status">Vytvoř hru nebo zadej kód soupeře.</p>
    <button id="start-btn" style="display:none;">START ZÁVODU</button>
</div>

<script>
    // --- INTEGRACE TVÉHO FIREBASE PROJEKTU ---
    const firebaseConfig = {
        apiKey: "AIzaSyADCqnyF13k2oHefln1rNBqvZm5_BnroPo",
        authDomain: "hlasovahra.firebaseapp.com",
        databaseURL: "https://hlasovahra-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hlasovahra",
        storageBucket: "hlasovahra.firebasestorage.app",
        messagingSenderId: "7010973655",
        appId: "1:7010973655:web:a9134f8f83d4b1e104bd92",
        measurementId: "G-L3SHDVNWWW"
    };
    
    // Inicializace připojení k databázi
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- HERNÍ PARAMETRY ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    const LANE1_Y = 110; // Výška tratě pro Hráče 1
    const LANE2_Y = 250; // Výška tratě pro Hráče 2
    const RUNNER_X = 80;
    const HURDLE_X = 180; // Fixní pozice překážky před běžcem

    const languageMaps1To10 = {
        'cs-CZ': { 1: ['1', 'jeden', 'jedna'], 2: ['2', 'dva'], 3: ['3', 'tři'], 4: ['4', 'čtyři'], 5: ['5', 'pět'], 6: ['6', 'šest'], 7: ['7', 'sedm'], 8: ['8', 'osm'], 9: ['9', 'devět'], 10: ['10', 'deset'] },
        'en-US': { 1: ['1', 'one'], 2: ['2', 'two'], 3: ['3', 'three'], 4: ['4', 'four'], 5: ['5', 'five'], 6: ['6', 'six'], 7: ['7', 'seven'], 8: ['8', 'eight'], 9: ['9', 'nine'], 10: ['10', 'ten'] },
        'de-DE': { 1: ['1', 'eins', 'eine'], 2: ['2', 'zwei'], 3: ['3', 'drei'], 4: ['4', 'vier'], 5: ['5', 'fünf'], 6: ['6', 'sechs'], 7: ['7', 'sieben'], 8: ['8', 'acht'], 9: ['9', 'neun'], 10: ['10', 'zehn'] },
        'fr-FR': { 1: ['1', 'un', 'une'], 2: ['2', 'deux'], 3: ['3', 'trois'], 4: ['4', 'quatre'], 5: ['5', 'cinq'], 6: ['6', 'six'], 7: ['7', 'sept'], 8: ['8', 'huit'], 9: ['9', 'neuf'], 10: ['10', 'dix'] },
        'fi-FI': { 1: ['1', 'yksi'], 2: ['2', 'kaksi'], 3: ['3', 'kolme'], 4: ['4', 'neljä'], 5: ['5', 'viisi'], 6: ['6', 'kuusi'], 7: ['7', 'seitsemän'], 8: ['8', 'kahdeksan'], 9: ['9', 'yhdeksän'], 10: ['10', 'kymmenen'] }
    };

    let roomRef = null;
    let myRole = null; // 'p1' nebo 'p2'
    let oppRole = null;
    
    let myState = { score: 0, lives: 3, currentNumber: 0, state: 'running', y: 0 };
    let oppState = { score: 0, lives: 3, currentNumber: 0, state: 'running', y: 0 };
    let gameStarted = false;

    const statusEl = document.getElementById('status');
    const numberEl = document.getElementById('number-display');
    const startBtn = document.getElementById('start-btn');
    const myHudEl = document.getElementById('my-hud');
    const oppHudEl = document.getElementById('opp-hud');

    myState.y = LANE1_Y;
    oppState.y = LANE2_Y;

    // --- NASTAVENÍ HLASOVÉHO GOOGLE API ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.onresult = (e) => handleVoice(e.results[e.results.length-1][0].transcript);
        recognition.onend = () => { if (gameStarted && myState.lives > 0) recognition.start(); };
    }

    // --- MULTIPLAYER LOBBY MANAGEMENT ---
    document.getElementById('create-btn').addEventListener('click', () => {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        myRole = 'p1'; oppRole = 'p2';
        myState.y = LANE1_Y; oppState.y = LANE2_Y;
        
        roomRef = db.ref('rooms/' + code);
        roomRef.set({
            p1: { score: 0, lives: 3, state: 'running', y: LANE1_Y, currentNumber: 0 },
            status: 'waiting'
        });
        
        document.getElementById('room-display').textContent = `Tvůj kód hry: ${code}`;
        statusEl.textContent = "Nasdílej kód soupeři a počkej, až se připojí...";
        listenToRoom();
    });

    document.getElementById('join-btn').addEventListener('click', () => {
        const code = document.getElementById('room-input').value.trim();
        if(!code) return;
        myRole = 'p2'; oppRole = 'p1';
        myState.y = LANE2_Y; oppState.y = LANE1_Y;

        roomRef = db.ref('rooms/' + code);
        roomRef.once('value', (snap) => {
            if(!snap.exists()) {
                statusEl.textContent = "Závod s tímto kódem nebyl nalezen!";
            } else {
                roomRef.update({
                    p2: { score: 0, lives: 3, state: 'running', y: LANE2_Y, currentNumber: 0 },
                    status: 'ready'
                });
                document.getElementById('room-display').textContent = `Připojen do hry: ${code}`;
                listenToRoom();
            }
        });
    });

    function listenToRoom() {
        roomRef.on('value', (snap) => {
            const data = snap.val();
            if(!data) return;

            if (data[oppRole]) oppState = data[oppRole];
            if (data[myRole]) myState.currentNumber = data[myRole].currentNumber;

            // Aktualizace textových HUDů nad plátnem
            let myHearts = "❤️".repeat(Math.max(0, myState.lives)) + "🖤".repeat(3 - Math.max(0, myState.lives));
            let oppHearts = "❤️".repeat(Math.max(0, oppState.lives)) + "🖤".repeat(3 - Math.max(0, oppState.lives));
            myHudEl.textContent = `Ty (${myRole.toUpperCase()}): ${myState.score} m (${myHearts})`;
            oppHudEl.textContent = `Soupeř (${oppRole.toUpperCase()}): ${oppState.score} m (${oppHearts})`;

            if (data.status === 'ready' && !gameStarted) {
                if (myRole === 'p1') {
                    startBtn.style.display = 'inline-block';
                    statusEl.textContent = "Soupeř se připojil! Můžeš odstartovat závod.";
                } else {
                    statusEl.textContent = "Připojeno. Čekej, až zakladatel odstartuje závod...";
                }
            }
            if (data.status === 'playing' && !gameStarted) {
                executeStart();
            }
        });
    }

    startBtn.addEventListener('click', () => {
        if (myRole === 'p1' && roomRef) {
            roomRef.update({ status: 'playing' });
            // Vygenerování prvotních unikátních čísel pro oba běžce
            roomRef.child('p1/currentNumber').set(Math.floor(Math.random() * 100) + 1);
            roomRef.child('p2/currentNumber').set(Math.floor(Math.random() * 100) + 1);
        }
    });

    function executeStart() {
        gameStarted = true;
        startBtn.style.display = 'none';
        statusEl.textContent = "Běž! Vyslov správné číslo, abys přeskočil překážku.";
        if (recognition) {
            recognition.lang = document.getElementById('lang-select').value;
            recognition.start();
        }
        requestAnimationFrame(gameLoop);
    }

    // --- REAKCE NA HLAS ---
    function handleVoice(rawText) {
        if (!gameStarted || myState.state !== 'running' || myState.lives <= 0) return;

        const cleanText = rawText.toLowerCase().replace(/[.,?!]/g, '').trim();
        statusEl.textContent = `Slyšel jsem: "${cleanText}"`;

        const currentLang = document.getElementById('lang-select').value;
        let matched = false;

        if (myState.currentNumber <= 10) {
            const validAnswers = languageMaps1To10[currentLang][myState.currentNumber];
            if (validAnswers && validAnswers.includes(cleanText)) matched = true;
        } else {
            if (cleanText === myState.currentNumber.toString()) matched = true;
        }

        if (matched) {
            triggerJump();
        } else {
            triggerTrip();
        }
    }

    function triggerJump() {
        myState.state = 'jumping';
        sendStateToFirebase();

        let jumpHeight = 0;
        let direction = 1;
        const defaultY = (myRole === 'p1') ? LANE1_Y : LANE2_Y;

        const jumpInterval = setInterval(() => {
            jumpHeight += 6 * direction;
            myState.y = defaultY - jumpHeight;
            sendStateToFirebase();

            if (jumpHeight >= 80) direction = -1;
            if (jumpHeight <= 0 && direction === -1) {
                clearInterval(jumpInterval);
                myState.state = 'running';
                myState.y = defaultY;
                myState.score += 10; // Přeskočení překážky tě posune o 10 metrů dál!
                myState.currentNumber = Math.floor(Math.random() * 100) + 1;
                sendStateToFirebase();
            }
        }, 20);
    }

    function triggerTrip() {
        myState.state = 'tripping';
        myState.lives--;
        sendStateToFirebase();

        setTimeout(() => {
            if (myState.lives <= 0) {
                myState.state = 'gameover';
                statusEl.textContent = "Konec závodu! Tvoje životy vypršely.";
            } else {
                myState.state = 'running';
                myState.currentNumber = Math.floor(Math.random() * 100) + 1;
            }
            sendStateToFirebase();
        }, 1200); // Ochraná penalizace na zemi
    }

    function sendStateToFirebase() {
        if (roomRef) {
            roomRef.child(myRole).update({
                score: myState.score,
                lives: myState.lives,
                state: myState.state,
                y: myState.y,
                currentNumber: myState.currentNumber
            });
        }
    }

    // --- VYMALOVÁNÍ GRAFIKY ZÁVODU ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // --- TRAŤ 1 (Horní - Hráč 1) ---
        ctx.fillStyle = "#8d6e63"; ctx.fillRect(0, LANE1_Y, canvas.width, 40); 
        ctx.fillStyle = "#f1c40f"; ctx.fillRect(0, LANE1_Y - 5, canvas.width, 10); 
        ctx.fillStyle = "#2c3e50"; ctx.fillRect(HURDLE_X, LANE1_Y - 30, 15, 30); // Pevná překážka
        
        ctx.fillStyle = (oppState.state === 'tripping' && myRole === 'p2') || (myState.state === 'tripping' && myRole === 'p1') ? "#c0392b" : "#3498db";
        let p1_Y = (myRole === 'p1') ? myState.y : oppState.y;
        ctx.fillRect(RUNNER_X, p1_Y - 40, 30, 40);

        // --- TRAŤ 2 (Dolní - Hráč 2) ---
        ctx.fillStyle = "#70544c"; ctx.fillRect(0, LANE2_Y, canvas.width, 40);
        ctx.fillStyle = "#f39c12"; ctx.fillRect(0, LANE2_Y - 5, canvas.width, 10);
        ctx.fillStyle = "#2c3e50"; ctx.fillRect(HURDLE_X, LANE2_Y - 30, 15, 30); // Pevná překážka
        
        ctx.fillStyle = (oppState.state === 'tripping' && myRole === 'p1') || (myState.state === 'tripping' && myRole === 'p2') ? "#c0392b" : "#2ecc71";
        let p2_Y = (myRole === 'p2') ? myState.y : oppState.y;
        ctx.fillRect(RUNNER_X, p2_Y - 40, 30, 40);

        // Popisky drah
        ctx.fillStyle = "white"; ctx.font = "bold 13px sans-serif";
        ctx.fillText("Hráč 1 (P1)", 15, LANE1_Y + 25);
        ctx.fillText("Hráč 2 (P2)", 15, LANE2_Y + 25);
    }

    function gameLoop() {
        draw();
        
        // Zobrazování aktuálního stavu na velkém displeji
        if (myState.lives > 0 && myState.state === 'running') {
            numberEl.textContent = myState.currentNumber;
        } else if (myState.state === 'tripping') {
            numberEl.textContent = "💥";
        } else if (myState.lives <= 0) {
            numberEl.textContent = "KO";
        }
        requestAnimationFrame(gameLoop);
    }

    // Vykreslení základní scény před startem
    draw();
</script>
</body>
</html>
