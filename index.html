<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hlasový Přetahovaný Závod</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .screen { display: none; }
        .active { display: block; }

        .menu-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin: 15px 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .hud-container {
            display: flex;
            justify-content: space-between;
            background: #34495e;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        #number-display {
            font-size: 80px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
            background: #edf2f7;
            border-radius: 10px;
            padding: 5px;
        }
        canvas {
            width: 100%;
            height: 300px;
            background-color: #f1c40f;
            border: 4px solid #d35400;
            border-radius: 10px;
            display: block;
        }
        input, select, button {
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-large { font-size: 18px; padding: 15px 35px; }
        
        #status { font-style: italic; color: #7f8c8d; min-height: 35px; margin: 10px 0; }
        .room-info { font-weight: bold; color: #e67e22; font-size: 20px; }

        /* Stylování výsledkové tabulky */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .stats-table th, .stats-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .stats-table th { background-color: #34495e; color: white; }
        .winner-announcement { font-size: 28px; color: #2ecc71; font-weight: bold; margin: 15px; }
    </style>
</head>
<body>

<div class="container">

    <div id="screen-main" class="screen active">
        <h2>Hlasový Závod: Přetahovaná</h2>
        <div class="menu-card">
            <p>Vyber si herní režim:</p>
            <button id="mode-solo-btn" class="btn-large">Hrát sám (Proti AI)</button>
            <button id="mode-online-btn" class="btn-large" style="background-color: #9b59b6;">Hrát online (Multiplayer)</button>
        </div>
        <div>
            <label>Jazyk tréninku: </label>
            <select id="lang-select">
                <option value="cs-CZ">Čeština</option>
                <option value="en-US">English</option>
                <option value="de-DE">Deutsch</option>
                <option value="fr-FR">Français</option>
                <option value="fi-FI">Suomi</option>
            </select>
        </div>
    </div>

    <div id="screen-lobby-select" class="screen">
        <h2>Online Hra</h2>
        <div class="menu-card">
            <label>Počet hráčů v místnosti: </label>
            <select id="player-count-select">
                <option value="2">2 Hráči (Duel)</option>
            </select>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            <button id="create-room-btn" class="btn-success">Vytvořit novou hru</button>
            <p>nebo se připoj ke stávající:</p>
            <input type="text" id="room-code-input" placeholder="Zadej kód hry">
            <button id="join-room-btn">Připojit se</button>
        </div>
        <button onclick="changeScreen('screen-main')">← Zpět do menu</button>
    </div>

    <div id="screen-game" class="screen">
        <div id="room-id-display" class="room-info"></div>
        <div class="hud-container">
            <div id="my-hud">Ty: 0 bodů</div>
            <div id="opp-hud">Soupeř: 0 bodů</div>
        </div>

        <div id="number-display">-</div>
        <canvas id="game-canvas" width="600" height="300"></canvas>
        <p id="status">Připrav se...</p>
        <button id="start-match-btn" class="btn-success btn-large" style="display:none;">START ZÁVODU</button>
    </div>

    <div id="screen-victory" class="screen">
        <div id="victory-title" class="winner-announcement">Vítěz!</div>
        <h3>Přehled zápasu</h3>
        <table class="stats-table">
            <thead>
                <tr>
                    <th>Hráč</th>
                    <th>Správná čísla</th>
                    <th>Zbylo životů</th>
                    <th>Stav</th>
                </tr>
            </thead>
            <tbody id="stats-tbody">
                </tbody>
        </table>
        
        <div id="replay-section" style="margin-top: 25px; display: none;">
            <p>Chcete hrát znovu?</p>
            <button id="rematch-btn" class="btn-success btn-large">Ano, nová hra</button>
            <button onclick="changeScreen('screen-main')" style="background-color: #7f8c8d;">Ne, do menu</button>
        </div>
    </div>

</div>

<script>
    // --- FIREBASE KONFIGURACE ---
    const firebaseConfig = {
        apiKey: "AIzaSyADCqnyF13k2oHefln1rNBqvZm5_BnroPo",
        authDomain: "hlasovahra.firebaseapp.com",
        databaseURL: "https://hlasovahra-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hlasovahra",
        storageBucket: "hlasovahra.firebasestorage.app",
        messagingSenderId: "7010973655",
        appId: "1:7010973655:web:a9134f8f83d4b1e104bd92",
        measurementId: "G-L3SHDVNWWW"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- CONFIG TRATÍ ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const LANE1_Y = 110;
    const LANE2_Y = 250;
    const BASE_X = 220; // Výchozí středová pozice, odkud se hráči přetahují
    const STEP_X = 85;   // Kolik pixelů dopředu skočí hráč za bod k dobru (4 * 85 = +340px -> konec obrazovky)

    const languageMaps1To10 = {
        'cs-CZ': { 1: ['1', 'jeden', 'jedna'], 2: ['2', 'dva'], 3: ['3', 'tři'], 4: ['4', 'čtyři'], 5: ['5', 'pět'], 6: ['6', 'šest'], 7: ['7', 'sedm'], 8: ['8', 'osm'], 9: ['9', 'devět'], 10: ['10', 'deset'] },
        'en-US': { 1: ['1', 'one'], 2: ['2', 'two'], 3: ['3', 'three'], 4: ['4', 'four'], 5: ['5', 'five'], 6: ['6', 'six'], 7: ['7', 'seven'], 8: ['8', 'eight'], 9: ['9', 'nine'], 10: ['10', 'ten'] },
        'de-DE': { 1: ['1', 'eins', 'eine'], 2: ['2', 'zwei'], 3: ['3', 'drei'], 4: ['4', 'vier'], 5: ['5', 'fünf'], 6: ['6', 'sechs'], 7: ['7', 'sieben'], 8: ['8', 'acht'], 9: ['9', 'neun'], 10: ['10', 'zehn'] },
        'fr-FR': { 1: ['1', 'un', 'une'], 2: ['2', 'deux'], 3: ['3', 'trois'], 4: ['4', 'quatre'], 5: ['5', 'cinq'], 6: ['6', 'six'], 7: ['7', 'sept'], 8: ['8', 'huit'], 9: ['9', 'neuf'], 10: ['10', 'dix'] },
        'fi-FI': { 1: ['1', 'yksi'], 2: ['2', 'kaksi'], 3: ['3', 'kolme'], 4: ['4', 'neljä'], 5: ['5', 'viisi'], 6: ['6', 'kuusi'], 7: ['7', 'seitsemän'], 8: ['8', 'kahdeksan'], 9: ['9', 'yhdeksän'], 10: ['10', 'kymmenen'] }
    };

    // --- STAV SYSTÉMU ---
    let gameMode = 'solo'; // 'solo' nebo 'online'
    let roomRef = null;
    let myRole = 'p1'; 
    let oppRole = 'p2';
    let botInterval = null;

    let myState = { score: 0, lives: 3, currentNumber: 0, state: 'running', y: LANE1_Y };
    let oppState = { score: 0, lives: 3, currentNumber: 0, state: 'running', y: LANE2_Y };
    let gameStarted = false;

    // DOM elementy plochy
    const statusEl = document.getElementById('status');
    const numberEl = document.getElementById('number-display');
    const startMatchBtn = document.getElementById('start-match-btn');
    const myHudEl = document.getElementById('my-hud');
    const oppHudEl = document.getElementById('opp-hud');

    // --- HLASOVÉ API ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.onresult = (e) => handleVoice(e.results[e.results.length-1][0].transcript);
        recognition.onend = () => { if (gameStarted && myState.lives > 0 && myState.state !== 'won') recognition.start(); };
    }

    // --- MANAGEMENT OBRAZOVEK ---
    function changeScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId !== 'screen-game') {
            resetGameEngine();
        }
    }

    function resetGameEngine() {
        gameStarted = false;
        if(recognition) try { recognition.stop(); } catch(e){}
        if(botInterval) clearInterval(botInterval);
        if(roomRef) roomRef.off();
        myState = { score: 0, lives: 3, currentNumber: 0, state: 'running', y: LANE1_Y };
        oppState = { score: 0, lives: 3, currentNumber: 0, state: 'running', y: LANE2_Y };
        document.getElementById('replay-section').style.display = 'none';
    }

    // --- MENU INTERAKCE ---
    document.getElementById('mode-solo-btn').addEventListener('click', () => {
        gameMode = 'solo';
        myRole = 'p1';
        oppRole = 'bot';
        changeScreen('screen-game');
        document.getElementById('room-id-display').textContent = "Tréninkový závod (Sólo)";
        startMatchBtn.style.display = 'inline-block';
        statusEl.textContent = "Připraven. Klikni na start.";
        updateHUDText();
    });

    document.getElementById('mode-online-btn').addEventListener('click', () => {
        gameMode = 'online';
        changeScreen('screen-lobby-select');
    });

    // Vytvoření online místnosti
    document.getElementById('create-room-btn').addEventListener('click', () => {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        myRole = 'p1'; oppRole = 'p2';
        myState.y = LANE1_Y; oppState.y = LANE2_Y;
        
        roomRef = db.ref('rooms/' + code);
        roomRef.set({
            p1: { score: 0, lives: 3, state: 'running', y: LANE1_Y, currentNumber: 0 },
            status: 'waiting',
            mode: 'online'
        });
        
        changeScreen('screen-game');
        document.getElementById('room-id-display').textContent = `Kód hry: ${code}`;
        statusEl.textContent = "Čekání na soupeře...";
        listenToRoom();
    });

    // Připojení do místnosti
    document.getElementById('join-room-btn').addEventListener('click', () => {
        const code = document.getElementById('room-code-input').value.trim();
        if(!code) return;
        myRole = 'p2'; oppRole = 'p1';
        myState.y = LANE2_Y; oppState.y = LANE1_Y;

        roomRef = db.ref('rooms/' + code);
        roomRef.once('value', (snap) => {
            if(!snap.exists()) {
                alert("Závod s tímto kódem neexistuje!");
            } else {
                roomRef.update({
                    p2: { score: 0, lives: 3, state: 'running', y: LANE2_Y, currentNumber: 0 },
                    status: 'ready'
                });
                changeScreen('screen-game');
                document.getElementById('room-id-display').textContent = `Kód hry: ${code}`;
                listenToRoom();
            }
        });
    });

    // --- SYNCHRONIZACE LOBBY ---
    function listenToRoom() {
        roomRef.on('value', (snap) => {
            const data = snap.val();
            if(!data) return;

            if (data[oppRole]) oppState = data[oppRole];
            if (data[myRole] && gameStarted) {
                // Převzít vygenerované číslo z databáze, pokud zrovna běžíme
                myState.currentNumber = data[myRole].currentNumber;
            }

            updateHUDText();
            checkWinConditions();

            if (data.status === 'ready' && !gameStarted) {
                if (myRole === 'p1') {
                    startMatchBtn.style.display = 'inline-block';
                    statusEl.textContent = "Soupeř připojen. Můžeš odstartovat!";
                } else {
                    statusEl.textContent = "Čekej, až zakladatel spustí závod...";
                }
            }
            if (data.status === 'playing' && !gameStarted) {
                executeStart();
            }
        });
    }

    function updateHUDText() {
        let myHearts = "❤️".repeat(Math.max(0, myState.lives)) + "🖤".repeat(3 - Math.max(0, myState.lives));
        let oppHearts = "❤️".repeat(Math.max(0, oppState.lives)) + "🖤".repeat(3 - Math.max(0, oppState.lives));
        
        myHudEl.textContent = `${myRole === 'p1' ? 'Hráč 1 (Ty)' : 'Hráč 2 (Ty)'}: ${myState.score} b. (${myHearts})`;
        oppHudEl.textContent = `${oppRole === 'p2' ? 'Hráč 2 (Soupeř)' : 'Hráč 1 (Soupeř)'}: ${oppState.score} b. (${oppHearts})`;
    }

    // Spuštění zápasu (kliknutí na start)
    startMatchBtn.addEventListener('click', () => {
        if (gameMode === 'solo') {
            executeStart();
        } else if (myRole === 'p1' && roomRef) {
            roomRef.update({ status: 'playing' });
            roomRef.child('p1/currentNumber').set(Math.floor(Math.random() * 100) + 1);
            roomRef.child('p2/currentNumber').set(Math.floor(Math.random() * 100) + 1);
        }
    });

    function executeStart() {
        gameStarted = true;
        startMatchBtn.style.display = 'none';
        statusEl.textContent = "Závod odstartován! Mluv!";
        
        if (gameMode === 'solo') {
            myState.currentNumber = Math.floor(Math.random() * 10) + 1; // Pro začátek lehčí čísla 1-10
            startSoloBot();
        }

        if (recognition) {
            recognition.lang = document.getElementById('lang-select').value;
            recognition.start();
        }
        requestAnimationFrame(gameLoop);
    }

    // --- SOLO BOT LOGIKA ---
    function startSoloBot() {
        botInterval = setInterval(() => {
            if (!gameStarted || oppState.lives <= 0 || myState.state === 'won') return;
            
            // Bot každé 4 sekundy zkusí odpovědět s 60% úspěšností
            if (Math.random() < 0.60) {
                oppState.state = 'jumping';
                let botYDefault = LANE2_Y;
                let jH = 0; let dir = 1;
                
                let bJmp = setInterval(() => {
                    jH += 6 * dir;
                    oppState.y = botYDefault - jH;
                    if(jH >= 80) dir = -1;
                    if(jH <= 0 && dir === -1) {
                        clearInterval(bJmp);
                        oppState.state = 'running';
                        oppState.y = botYDefault;
                        oppState.score++;
                        checkWinConditions();
                    }
                }, 20);
            } else {
                // Bot občas zakopne
                if(Math.random() < 0.3) {
                    oppState.state = 'tripping';
                    oppState.lives--;
                    checkWinConditions();
                    setTimeout(() => { if(oppState.lives > 0) oppState.state = 'running'; }, 1200);
                }
            }
        }, 4000);
    }

    // --- VYHODNOCENÍ VÍTĚZSTVÍ ---
    function checkWinConditions() {
        if (!gameStarted) return;

        let winner = null;

        // Vítězství na základě bodového rozdílu o 4 čísla
        if (myState.score - oppState.score >= 4) winner = myRole;
        else if (oppState.score - myState.score >= 4) winner = oppRole;
        
        // Vítězství, pokud sok ztratí všechny životy
        if (myState.lives <= 0) winner = oppRole;
        if (oppState.lives <= 0) winner = myRole;

        if (winner) {
            gameStarted = false;
            if(roomRef) roomRef.child('status').set('finished');
            showVictoryScreen(winner);
        }
    }

    function showVictoryScreen(winnerRole) {
        if(botInterval) clearInterval(botInterval);
        if(recognition) try { recognition.stop(); } catch(e){}

        const titleEl = document.getElementById('victory-title');
        const tbody = document.getElementById('stats-tbody');
        tbody.innerHTML = "";

        if (winnerRole === myRole) {
            titleEl.textContent = "🎉 Vyhrál jsi závod! 🎉";
            titleEl.style.color = "#2ecc71";
        } else {
            titleEl.textContent = "💀 Prohrál jsi! Soupeř tě udolal. 💀";
            titleEl.style.color = "#e74c3c";
        }

        // Sestavení výsledkové tabulky
        let playersToRender = [];
        if (gameMode === 'solo') {
            playersToRender = [
                { name: "Ty (Hráč 1)", score: myState.score, lives: myState.lives, status: winnerRole === 'p1' ? "VÍTĚZ" : "PORAŽEN" },
                { name: "Počítač (AI)", score: oppState.score, lives: oppState.lives, status: winnerRole === 'bot' ? "VÍTĚZ" : "PORAŽEN" }
            ];
        } else {
            playersToRender = [
                { name: "Hráč 1 " + (myRole === 'p1' ? "(Ty)" : ""), score: (myRole === 'p1' ? myState.score : oppState.score), lives: (myRole === 'p1' ? myState.lives : oppState.lives), status: winnerRole === 'p1' ? "VÍTĚZ" : "PORAŽEN" },
                { name: "Hráč 2 " + (myRole === 'p2' ? "(Ty)" : ""), score: (myRole === 'p2' ? myState.score : oppState.score), lives: (myRole === 'p2' ? myState.lives : oppState.lives), status: winnerRole === 'p2' ? "VÍTĚZ" : "PORAŽEN" }
            ];
        }

        playersToRender.forEach(p => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${p.name}</b></td><td>${p.score}</td><td>${p.lives}/3</td><td>${p.status}</td>`;
            tbody.appendChild(tr);
        });

        changeScreen('screen-victory');

        // Otázka chci hrát znovu se ukáže s mírným zpožděním (1.5s)
        setTimeout(() => {
            document.getElementById('replay-section').style.display = 'block';
        }, 1500);
    }

    // Reakce na stisknutí "Chci hrát znovu"
    document.getElementById('rematch-btn').addEventListener('click', () => {
        if (gameMode === 'solo') {
            resetGameEngine();
            changeScreen('screen-game');
            startMatchBtn.style.display = 'inline-block';
            statusEl.textContent = "Nový trénink připraven.";
            updateHUDText();
        } else {
            // V online režimu vyčistíme místnost na Firebase pro nový start
            resetGameEngine();
            if (roomRef) {
                if (myRole === 'p1') {
                    roomRef.set({
                        p1: { score: 0, lives: 3, state: 'running', y: LANE1_Y, currentNumber: 0 },
                        status: 'ready',
                        mode: 'online'
                    });
                }
                changeScreen('screen-game');
                listenToRoom();
            }
        }
    });

    // --- HLASOVÁ DETEKCE ---
    function handleVoice(rawText) {
        if (!gameStarted || myState.state !== 'running' || myState.lives <= 0) return;

        const cleanText = rawText.toLowerCase().replace(/[.,?!]/g, '').trim();
        statusEl.textContent = `Slyšel jsem: "${cleanText}"`;

        const currentLang = document.getElementById('lang-select').value;
        let matched = false;

        if (myState.currentNumber <= 10) {
            const validAnswers = languageMaps1To10[currentLang][myState.currentNumber];
            if (validAnswers && validAnswers.includes(cleanText)) matched = true;
        } else {
            if (cleanText === myState.currentNumber.toString()) matched = true;
        }

        if (matched) {
            triggerJump();
        } else {
            triggerTrip();
        }
    }

    function triggerJump() {
        myState.state = 'jumping';
        sendStateToFirebase();

        let jumpHeight = 0; let direction = 1;
        const defaultY = (myRole === 'p1') ? LANE1_Y : LANE2_Y;

        const jumpInterval = setInterval(() => {
            jumpHeight += 6 * direction;
            myState.y = defaultY - jumpHeight;
            sendStateToFirebase();

            if (jumpHeight >= 80) direction = -1;
            if (jumpHeight <= 0 && direction === -1) {
                clearInterval(jumpInterval);
                myState.state = 'running';
                myState.y = defaultY;
                myState.score++; // Správné číslo = +1 bod
                myState.currentNumber = Math.floor(Math.random() * 50) + 1; // Další náhodné číslo
                sendStateToFirebase();
                checkWinConditions();
            }
        }, 20);
    }

    function triggerTrip() {
        myState.state = 'tripping';
        myState.lives--;
        sendStateToFirebase();
        checkWinConditions();

        setTimeout(() => {
            if (myState.lives > 0 && gameStarted) {
                myState.state = 'running';
                myState.currentNumber = Math.floor(Math.random() * 50) + 1;
                sendStateToFirebase();
            }
        }, 1200);
    }

    function sendStateToFirebase() {
        if (gameMode === 'online' && roomRef) {
            roomRef.child(myRole).update({
                score: myState.score,
                lives: myState.lives,
                state: myState.state,
                y: myState.y,
                currentNumber: myState.currentNumber
            });
        }
    }

    // --- DYNAMICKÉ VYKRESLOVÁNÍ POLOHY (RENDER ENGINE) ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let p1_score = (myRole === 'p1') ? myState.score : oppState.score;
        let p2_score = (myRole === 'p2') ? myState.score : oppState.score;

        // Výpočet dynamických X souřadnic (přetahovaná)
        // Když p1_score - p2_score == 4, p1 dosáhne pravého okraje (BASE_X + 4 * STEP_X = 220 + 340 = 560px)
        let p1_X = BASE_X + (p1_score - p2_score) * STEP_X;
        let p2_X = BASE_X + (p2_score - p1_score) * STEP_X;

        // Omezení, aby běžci nevyběhli úplně mimo levý okraj plátna
        p1_X = Math.max(30, Math.min(560, p1_X));
        p2_X = Math.max(30, Math.min(560, p2_X));

        // Pozice překážek se dynamicky generuje těsně před aktuálním běžcem!
        let p1_hurdle_X = p1_X + 50;
        let p2_hurdle_X = p2_X + 50;

        // --- DRÁHA 1 (Hráč 1) ---
        ctx.fillStyle = "#8d6e63"; ctx.fillRect(0, LANE1_Y, canvas.width, 40); 
        ctx.fillStyle = "#f1c40f"; ctx.fillRect(0, LANE1_Y - 5, canvas.width, 10); 
        // Překážka pro Hráče 1 se kreslí jen, pokud nedorazil na úplný konec obrazovky
        if(p1_X < 550) {
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(p1_hurdle_X, LANE1_Y - 25, 12, 25);
        }
        // Vykreslení postavy Hráče 1
        ctx.fillStyle = (myRole === 'p1' && myState.state === 'tripping') || (myRole === 'p2' && oppState.state === 'tripping') ? "#c0392b" : "#3498db";
        let p1_Y = (myRole === 'p1') ? myState.y : oppState.y;
        ctx.fillRect(p1_X, p1_Y - 40, 25, 40);

        // --- DRÁHA 2 (Hráč 2 / Bot) ---
        ctx.fillStyle = "#70544c"; ctx.fillRect(0, LANE2_Y, canvas.width, 40);
        ctx.fillStyle = "#f39c12"; ctx.fillRect(0, LANE2_Y - 5, canvas.width, 10);
        // Překážka pro Hráče 2
        if(p2_X < 550) {
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(p2_hurdle_X, LANE2_Y - 25, 12, 25);
        }
        // Vykreslení postavy Hráče 2
        ctx.fillStyle = (myRole === 'p2' && myState.state === 'tripping') || (myRole === 'p1' && oppState.state === 'tripping') ? "#c0392b" : "#2ecc71";
        let p2_Y = (myRole === 'p2') ? myState.y : oppState.y;
        ctx.fillRect(p2_X, p2_Y - 40, 25, 40);

        // Popisy drah na zemi
        ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif";
        ctx.fillText("Hráč 1 (Modrý)", 15, LANE1_Y + 25);
        ctx.fillText(gameMode === 'solo' ? "Počítač (Zelený)" : "Hráč 2 (Zelený)", 15, LANE2_Y + 25);

        // Cílové čáry na úplném konci obrazovky (X = 550)
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.fillRect(550, LANE1_Y - 40, 8, 40);
        ctx.fillRect(550, LANE2_Y - 40, 8, 40);
    }

    function gameLoop() {
        draw();
        if (gameStarted) {
            if (myState.lives > 0 && myState.state === 'running') {
                numberEl.textContent = myState.currentNumber;
            } else if (myState.state === 'tripping') {
                numberEl.textContent = "💥";
            } else if (myState.lives <= 0) {
                numberEl.textContent = "KO";
            }
            requestAnimationFrame(gameLoop);
        }
    }

    // Prvotní překreslení prázdné trati
    draw();
</script>
</body>
</html>
